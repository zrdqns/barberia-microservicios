spring.application.name=api-catalogo
server.port=8081

# Chrome envía en cada petición las cookies de todos los proyectos que hayan corrido en
# localhost. Con el límite por defecto (8 KB) Tomcat puede rechazarlas con un 400.
server.max-http-request-header-size=64KB

# Origen del frontend autorizado a consumir esta API
frontend.url=http://localhost:5173

# Dirección del microservicio de citas, al que se pregunta antes de eliminar un servicio o un barbero
api.citas.url=http://localhost:8080

# Base de datos en Supabase (PostgreSQL). Los datos de conexión van en el archivo .env de la raíz
# del repositorio, que no se sube a GitHub. Ver .env.example.
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# El pooler de Supabase admite pocas conexiones y las comparten los dos microservicios
spring.datasource.hikari.maximum-pool-size=3

# Este microservicio guarda sus tablas en el esquema "catalogo". schema.sql las crea si no
# existen y data.sql carga los datos de demostración solo cuando están vacías.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=catalogo
spring.jpa.open-in-view=false
