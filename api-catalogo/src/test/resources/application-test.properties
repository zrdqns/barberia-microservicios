# Las pruebas no tocan Supabase: cada contexto de Spring arranca con su propia base H2 en
# memoria, en modo PostgreSQL, y la llenan los mismos schema.sql y data.sql.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
